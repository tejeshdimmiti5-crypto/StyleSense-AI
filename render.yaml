services:
  - type: web
    name: chilliprofit-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CHILLIPROFIT_MODEL_URL
        value: https://github.com/tejeshdimmiti5-crypto/StyleSense-AI/releases/download/model-1/chilli_model.pt
      - key: CHILLIPROFIT_MODEL_SHA256
        value: b2db895fd43bf801fcc522c3f749fe8f5a9766583cc0e4f336a3553e645bb0ce
