name: Train chilli model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: false
        default: "12"
      batch_size:
        description: Batch size
        required: false
        default: "32"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Download primary dataset
        run: python ml/download_datasets.py

      - name: Train model
        run: python ml/train.py --epochs ${{ inputs.epochs }} --batch-size ${{ inputs.batch_size }}

      - name: Generate model integrity manifest
        run: |
          sha256sum ml/artifacts/chilli_model.pt > ml/artifacts/chilli_model.sha256
          python - <<'PY'
          import json
          from pathlib import Path

          metrics = json.loads(Path("ml/artifacts/chilli_model.json").read_text())
          print("Test accuracy:", metrics["test_accuracy"])
          print("Test macro F1:", metrics["test_macro_f1"])
          print("Best validation macro F1:", metrics["best_validation_macro_f1"])
          PY

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: chilliprofit-model-${{ github.run_number }}
          retention-days: 30
          path: |
            ml/artifacts/chilli_model.pt
            ml/artifacts/chilli_model.json
            ml/artifacts/chilli_model.sha256
