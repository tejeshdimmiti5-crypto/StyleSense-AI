name: Production API verification

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Base URL of the deployed ChilliProfit AI API
        required: true
        type: string
      expected_model:
        description: Require the trained model to be configured
        required: false
        default: "true"
        type: boolean
      expected_model_version:
        description: Expected deployed model release/version
        required: false
        default: "model-1"
        type: string
      expected_model_sha256:
        description: Expected SHA-256 of the deployed model
        required: false
        default: "b2db895fd43bf801fcc522c3f749fe8f5a9766583cc0e4f336a3553e645bb0ce"
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check service health
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$API_URL/health" | tee health.json
          python - <<'PY'
          import json
          data = json.load(open("health.json"))
          assert data.get("status") == "ok", data
          print("Health check: OK")
          PY

      - name: Check model status and identity
        env:
          API_URL: ${{ inputs.api_url }}
          EXPECTED_MODEL: ${{ inputs.expected_model }}
          EXPECTED_MODEL_VERSION: ${{ inputs.expected_model_version }}
          EXPECTED_MODEL_SHA256: ${{ inputs.expected_model_sha256 }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          curl --fail --silent --show-error --max-time 30 "$API_URL/api/health" | tee api-health.json
          python - <<'PY'
          import json
          import os
          data = json.load(open("api-health.json"))
          assert data.get("status") == "ok", data
          if os.environ.get("EXPECTED_MODEL", "true").lower() == "true":
              assert data.get("model_configured") is True, data
              model = data.get("model") or {}
              assert model.get("architecture") == "EfficientNet-B0", data
              assert len(model.get("classes", [])) == 5, data
              assert model.get("version") == os.environ["EXPECTED_MODEL_VERSION"], data
              assert model.get("sha256") == os.environ["EXPECTED_MODEL_SHA256"], data
          print("API/model identity: OK")
          print(data)
          PY

      - name: Verify image analysis endpoint
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          python - <<'PY'
          from PIL import Image
          image = Image.new("RGB", (32, 32), (90, 150, 40))
          image.save("smoke.jpg", format="JPEG")
          PY
          curl --fail --silent --show-error --max-time 60 \
            -F "file=@smoke.jpg;type=image/jpeg" \
            -F "zone=Zone 4" \
            "$API_URL/api/analyze" | tee analysis.json
          python - <<'PY'
          import json
          data = json.load(open("analysis.json"))
          assert data.get("status") == "prediction", data
          assert data.get("confidence") is not None, data
          assert isinstance(data.get("probabilities"), dict), data
          assert data.get("zone") == "Zone 4", data
          model = data.get("model") or {}
          assert model.get("version") is not None, data
          assert model.get("sha256") is not None, data
          print("Inference endpoint: OK")
          print("Prediction:", data.get("title"))
          print("Confidence:", data.get("confidence"))
          print("Zone:", data.get("zone"))
          print("Model:", model.get("version"))
          PY
